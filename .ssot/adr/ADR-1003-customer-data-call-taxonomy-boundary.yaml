body: |-
  ## Context
  
  Web and app analytics systems commonly expose collection primitives such as identify, track, page, screen, group, alias, capture, batch, pageview, custom events, and event properties.
  
  These calls can carry user or account identifiers, but their governance purpose in this pack is analytics collection, not identity profile governance.
  
  ## Decision
  
  This repository will treat identify, track, page, screen, group, alias, capture, batch, pageview, and custom event calls as analytics collection primitives when they appear in accepted source documentation.
  
  The pack will not treat those calls as full customer identity, access management, consent record, or profile unification authority.
  
  Packaged templates may require downstream repositories to distinguish call taxonomy, payload fields, context objects, identifiers, and event properties.
